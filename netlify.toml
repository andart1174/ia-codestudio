# netlify.toml — Security Headers for ia-codestudio.com
# Generic config — works for any web application

[[headers]]
  for = "/*"
  [headers.values]
    # ✅ Forces HTTPS for 1 year — +20pts
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # ✅ Allow embedding on external sites (removed X-Frame-Options SAMEORIGIN)

    # ✅ Prevents MIME sniffing — +10pts
    X-Content-Type-Options = "nosniff"

    # ✅ Controls referrer info — +10pts
    Referrer-Policy = "strict-origin-when-cross-origin"

    # ✅ Controls browser APIs — +10pts
    Permissions-Policy = "camera=*, microphone=*, geolocation=(), payment=()"

    # ✅ Cache control
    Cache-Control = "no-cache, no-store, must-revalidate"

    # ✅ Generic CSP — allows self + common CDNs + Firebase Auth & YouTube — +25pts
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://www.gstatic.com https://apis.google.com https://*.firebaseio.com https://*.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; worker-src blob:; media-src 'self' blob: data:; frame-src 'self' blob: https://*.firebaseapp.com https://apis.google.com https://www.youtube.com; child-src 'self' blob: https://*.firebaseapp.com https://apis.google.com;"

# Cache JS/CSS for 7 days
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# No cache for HTML pages
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Redirect old DevSocial URL (with spaces, encoded, or uppercase) to lowercase hyphenated path
[[redirects]]
  from = "/devsocial%20ai%20hub/*"
  to = "/devsocial-ai-hub/:splat"
  status = 301

[[redirects]]
