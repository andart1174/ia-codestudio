<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Fluid Simulation · Metaball Physics</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #020409;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      cursor: crosshair;
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
      display: block;
    }

    .hint-label {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: rgba(217, 70, 239, 0.55);
      z-index: 10;
      text-transform: uppercase;
      white-space: nowrap;
      animation: pulse-hint 2.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse-hint {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }

    .ia-badge {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(2, 4, 9, 0.82);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(217, 70, 239, 0.25);
      padding: 20px;
      border-radius: 16px;
      z-index: 10;
      max-width: 290px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 20px rgba(217,70,239,0.07);
      transition: all 0.3s ease;
    }

    .ia-badge:hover {
      border-color: rgba(217, 70, 239, 0.5);
      box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 30px rgba(217,70,239,0.2);
      transform: translateY(-2px);
    }

    .badge-tag {
      background: rgba(217, 70, 239, 0.18);
      color: #f0abfc;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: 30px;
      display: inline-block;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .ia-badge h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #fff 40%, #f0abfc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ia-badge p {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .badge-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #a21caf 0%, #7c3aed 100%);
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      padding: 10px 16px;
      border-radius: 20px;
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.1);
      width: 100%;
    }

    .badge-link:hover {
      background: linear-gradient(135deg, #c026d3 0%, #8b5cf6 100%);
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <canvas id="c"></canvas>

  <div class="hint-label">CLICK TO ADD LIQUID · HOVER TO ATTRACT</div>

  <div class="ia-badge">
    <span class="badge-tag">2D Physics · Metaballs</span>
    <h3>Neon Fluid Simulation</h3>
    <p>True metaball physics engine. Click anywhere to add neon liquid drops. Move mouse to attract them.</p>
    <a href="https://ia-codestudio.com" target="_blank" class="badge-link">
      Create More Widgets on IA Code Studio 🚀
    </a>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('c');
      const W = canvas.width = window.innerWidth;
      const H = canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');

      const SCALE = Math.max(4, Math.floor(Math.min(W, H) / 180));
      const LW = Math.floor(W / SCALE);
      const LH = Math.floor(H / SCALE);

      const offscreen = document.createElement('canvas');
      offscreen.width = LW;
      offscreen.height = LH;
      const offCtx = offscreen.getContext('2d');
      const imgData = offCtx.createImageData(LW, LH);
      const pixels = imgData.data;

      const palette = [
        [139,  92, 246],
        [  6, 182, 212],
        [217,  70, 239],
        [ 99, 102, 241],
        [ 34, 211, 238],
        [192, 132, 252],
        [244, 114, 182],
      ];

      const blobs = [];

      function spawnBlob(screenX, screenY, launched) {
        const col = palette[Math.floor(Math.random() * palette.length)];
        blobs.push({
          x:   screenX / SCALE,
          y:   screenY / SCALE,
          r:   4 + Math.random() * 8,
          vx:  (Math.random() - 0.5) * 1.6,
          vy:  launched ? (-1.8 - Math.random() * 2.2) : (Math.random() - 0.5) * 0.6,
          col: col
        });
      }

      for (let i = 0; i < 24; i++) {
        spawnBlob(Math.random() * W, Math.random() * H * 0.55, false);
      }

      let mouseX = -9999, mouseY = -9999;

      canvas.addEventListener('mousemove', (e) => { mouseX = e.clientX / SCALE; mouseY = e.clientY / SCALE; });
      canvas.addEventListener('mouseleave', () => { mouseX = -9999; mouseY = -9999; });
      canvas.addEventListener('click', (e) => { spawnBlob(e.clientX, e.clientY, true); });

      function update() {
        for (const b of blobs) {
          b.vy += 0.014;
          const dx = mouseX - b.x, dy = mouseY - b.y;
          const dist = Math.sqrt(dx*dx + dy*dy) + 0.1;
          if (dist < 24) { b.vx += (dx/dist)*0.09; b.vy += (dy/dist)*0.09; }
          b.x += b.vx; b.y += b.vy;
          b.vx *= 0.999; b.vy *= 0.999;
          if (b.x - b.r < 0)  { b.x = b.r;      b.vx =  Math.abs(b.vx)*0.55; }
          if (b.x + b.r > LW) { b.x = LW - b.r; b.vx = -Math.abs(b.vx)*0.55; }
          if (b.y + b.r > LH) { b.y = LH - b.r; b.vy = -Math.abs(b.vy)*0.52; b.vx *= 0.93; }
          if (b.y - b.r < 0)  { b.y = b.r;      b.vy =  Math.abs(b.vy)*0.3;  }
        }
      }

      function render() {
        const n = blobs.length;
        for (let py = 0; py < LH; py++) {
          for (let gx = 0; gx < LW; gx++) {
            let sum = 0, wr = 0, wg = 0, wb = 0;
            for (let i = 0; i < n; i++) {
              const b = blobs[i];
              const dx = gx - b.x, dy = py - b.y;
              const d2 = dx*dx + dy*dy + 0.01;
              const inf = (b.r * b.r) / d2;
              sum += inf; wr += b.col[0]*inf; wg += b.col[1]*inf; wb += b.col[2]*inf;
            }
            const idx = (py * LW + gx) * 4;
            if (sum >= 1.0) {
              const inv = 1/sum;
              let glow = sum < 1.8 ? (1.75 - (sum-1.0)*0.94) : (sum < 5 ? 1.05 : 0.80);
              pixels[idx]   = Math.min(wr*inv*glow, 255);
              pixels[idx+1] = Math.min(wg*inv*glow, 255);
              pixels[idx+2] = Math.min(wb*inv*glow, 255);
              pixels[idx+3] = 255;
            } else if (sum >= 0.20) {
              const inv = 1/(sum+0.01);
              const f = (sum-0.20)/0.80;
              const glowF = f*f*0.48;
              pixels[idx]   = Math.min(wr*inv*glowF, 255);
              pixels[idx+1] = Math.min(wg*inv*glowF, 255);
              pixels[idx+2] = Math.min(wb*inv*glowF, 255);
              pixels[idx+3] = 255;
            } else {
              pixels[idx] = 2; pixels[idx+1] = 4; pixels[idx+2] = 9; pixels[idx+3] = 255;
            }
          }
        }
        offCtx.putImageData(imgData, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(offscreen, 0, 0, W, H);
      }

      function animate() {
        requestAnimationFrame(animate);
        update();
        render();
      }

      animate();

      window.addEventListener('resize', () => {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    })();
  </script>
</body>
</html>
