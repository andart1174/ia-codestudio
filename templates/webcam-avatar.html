<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Webcam Point Cloud Avatar | IA Code Studio Open Source Templates</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #02040a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .info-hud {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(10, 25, 47, 0.75);
      border: 1px solid rgba(100, 255, 218, 0.2);
      border-radius: 8px;
      padding: 15px 20px;
      color: #64ffda;
      pointer-events: none;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
    .info-hud h1 {
      margin: 0 0 5px;
      font-size: 15px;
      font-weight: 700;
      color: #0ea5e9;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .info-hud p {
      margin: 0;
      font-size: 11px;
      color: #8892b0;
    }
    #fallback-warn {
      color: #ff7b72;
      font-size: 9px;
      margin-top: 5px;
      display: none;
    }
    /* Hidden webcam video element */
    #webcam-video {
      display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <video id="webcam-video" autoplay playsinline loop></video>

  <div class="info-hud">
    <h1>Webcam 3D Point-Cloud</h1>
    <p id="status-text">Requesting camera permissions...</p>
    <p id="fallback-warn">⚠️ Running in simulated mode. Serve via http://localhost or HTTPS to access webcam.</p>
  </div>

  <script>
    // 1. Initial Scene, Camera, and Renderer setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02040a, 0.008);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 80);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 2. Point Cloud Buffer Geometry creation
    const width = 80;
    const height = 60;
    const totalPoints = width * height;
    
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(totalPoints * 3);
    const colors = new Float32Array(totalPoints * 3);

    // Initial grid layout
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const i = (y * width + x);
        const idx = i * 3;
        
        // Spread grid in 3D Space
        positions[idx] = (x - width / 2) * 0.9;
        positions[idx + 1] = (y - height / 2) * 0.9;
        positions[idx + 2] = 0;
        
        // Dynamic cyan color gradient
        colors[idx] = 0.04;
        colors[idx + 1] = 0.65;
        colors[idx + 2] = 0.91;
      }
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.65,
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });

    const pointCloud = new THREE.Points(geometry, material);
    scene.add(pointCloud);

    // 3. Webcam initialization
    const video = document.getElementById('webcam-video');
    const statusText = document.getElementById('status-text');
    const fallbackWarn = document.getElementById('fallback-warn');
    
    let isWebcamActive = false;
    let captureCanvas = null;
    let ctx = null;

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } })
        .then(stream => {
          video.srcObject = stream;
          video.play();
          isWebcamActive = true;
          statusText.textContent = "Webcam active. Stand in front of the lens!";
          
          // Helper canvas to parse pixels
          captureCanvas = document.createElement('canvas');
          captureCanvas.width = width;
          captureCanvas.height = height;
          ctx = captureCanvas.getContext('2d');
        })
        .catch(err => {
          console.warn("Webcam access denied. Loading simulator.", err);
          statusText.textContent = "Webcam blocked or unavailable.";
          fallbackWarn.style.display = 'block';
        });
    } else {
      statusText.textContent = "Media API not supported in browser.";
      fallbackWarn.style.display = 'block';
    }

    // 4. Animation loop
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.02;

      const posArr = pointCloud.geometry.attributes.position.array;
      const colArr = pointCloud.geometry.attributes.color.array;

      if (isWebcamActive && ctx) {
        // Draw video frame to pixel extraction canvas
        ctx.drawImage(video, 0, 0, width, height);
        const imgData = ctx.getImageData(0, 0, width, height).data;

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const gridIdx = (y * width + x);
            // Flip x coordinate horizontally to match mirror reflection
            const srcIdx = (y * width + (width - 1 - x)) * 4;
            const posIdx = gridIdx * 3;

            // Get brightness
            const r = imgData[srcIdx];
            const g = imgData[srcIdx + 1];
            const b = imgData[srcIdx + 2];
            const brightness = (r + g + b) / 3;

            // Displace Z-depth coordinate according to brightness
            posArr[posIdx + 2] = (brightness / 255.0) * 16.0;

            // Apply texture color dynamically to points
            colArr[posIdx] = r / 255.0;
            colArr[posIdx + 1] = g / 255.0;
            colArr[posIdx + 2] = b / 255.0;
          }
        }
      } else {
        // FALLBACK: Procedural trigonometric wave displacement simulation
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const gridIdx = (y * width + x);
            const posIdx = gridIdx * 3;
            
            const dx = x - width / 2;
            const dy = y - height / 2;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // Displace Z
            posArr[posIdx + 2] = Math.sin(distance * 0.15 - time * 2) * 5 + Math.cos(x * 0.2 + time) * 3;

            // Procedural blue-purple gradient shift
            colArr[posIdx] = Math.sin(distance * 0.05 + time) * 0.3 + 0.4;
            colArr[posIdx + 1] = Math.cos(distance * 0.1 - time) * 0.3 + 0.5;
            colArr[posIdx + 2] = 0.9;
          }
        }
      }

      pointCloud.geometry.attributes.position.needsUpdate = true;
      pointCloud.geometry.attributes.color.needsUpdate = true;

      // Rotate pointcloud slightly
      pointCloud.rotation.y = Math.sin(time * 0.15) * 0.15;
      
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
