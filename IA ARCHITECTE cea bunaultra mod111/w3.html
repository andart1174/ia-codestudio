<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Background</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    margin: 0;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  
  /* Fluid Mesh Gradient Animation */
  .fluid-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: -1;
    background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
  }
  
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .content {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(5px);
  }

  h1 { font-size: 5rem; font-weight: 900; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  p { font-size: 1.5rem; font-weight: 500; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
</style>
</head>
<body>
  <div class="fluid-bg"></div>
  <div class="content">
    <div>
      <h1>Fluid Canvas</h1>
      <p>Beautiful animated backgrounds built entirely with CSS.</p>
    </div>
  </div>
</body>
</html>
