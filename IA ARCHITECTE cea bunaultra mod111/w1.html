<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Landing Page Hero</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #0f172a; color: #fff; overflow-x: hidden; }
  .hero-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    position: relative;
  }
  .hero-content {
    z-index: 2;
    max-width: 800px;
    padding: 0 20px;
    animation: fadeInUp 1s ease-out forwards;
  }
  .badge {
    display: inline-block;
    padding: 8px 16px;
    background: rgba(14, 165, 233, 0.1);
    color: #0ea5e9;
    border: 1px solid rgba(14, 165, 233, 0.3);
    border-radius: 50px;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 4.5rem;
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 20px;
    background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    font-size: 1.25rem;
    color: #94a3b8;
    margin-bottom: 40px;
    line-height: 1.6;
  }
  .cta-group {
    display: flex;
    gap: 20px;
    justify-content: center;
  }
  .btn-primary {
    background: #0ea5e9;
    color: #fff;
    padding: 16px 32px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    font-size: 1.1rem;
    transition: all 0.3s ease;
    box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3);
  }
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 25px rgba(14, 165, 233, 0.4);
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    padding: 16px 32px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    font-size: 1.1rem;
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-3px);
  }
  /* Decorative background elements */
  .glow {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, rgba(15,23,42,0) 70%);
    top: -200px;
    left: -200px;
    border-radius: 50%;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <section class="hero-section">
    <div class="glow"></div>
    <div class="hero-content">
      <div class="badge">🚀 v2.0 is now live</div>
      <h1>Build the Future of Web Apps</h1>
      <p>The ultimate platform for creators and developers to build, scale, and deploy stunning web applications faster than ever before.</p>
      <div class="cta-group">
        <a href="#" class="btn-primary">Get Started Free</a>
        <a href="#" class="btn-secondary">View Documentation</a>
      </div>
    </div>
  </section>
</body>
</html>
