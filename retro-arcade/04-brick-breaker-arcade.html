<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Brick Breaker (Arkanoid Arcade)</title>
  <style id="main-style">
    :root {
      --bg: #060814;
      --surface: #11162b;
      --surface-2: #1c2442;
      --border: #2e3b6b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #06b6d4;
      --accent-2: #22d3ee;
      --radius: 14px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 30px;
      overflow-x: hidden;
    }
    header {
      background: rgba(17, 22, 43, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #06b6d4, #6366f1);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    h1 { font-size: 1.1rem; font-weight: 700; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .lang-switch {
      display: flex;
      background: var(--surface-2);
      border-radius: 8px;
      padding: 2px;
      border: 1px solid var(--border);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 4px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .lang-btn.active { background: var(--accent); color: #000; }
    .stage {
      max-width: 780px;
      margin: 20px auto;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .hud-row {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .hud-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .hud-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
    .hud-val { font-size: 1.25rem; font-weight: 800; color: var(--accent-2); }
    canvas {
      width: 100%;
      max-width: 720px;
      height: auto;
      background: #040610;
      border: 2px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75);
      touch-action: none;
      display: block;
    }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-weight: 800;
      font-size: 0.84rem;
      cursor: pointer;
    }
    .btn-secondary {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    @media (max-width: 520px) {
      .hud-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">🧱</div>
      <h1 data-ulp="name" data-i18n="title">Neon Brick Breaker (Arkanoid Arcade)</h1>
    </div>
    <div class="header-actions">
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="fr">FR</button>
      </div>
    </div>
  </header>

  <main class="stage">
    <div class="hud-row">
      <div class="hud-box">
        <div class="hud-lbl" data-i18n="scoreLbl">Score</div>
        <div class="hud-val" id="scoreVal">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-lbl" data-i18n="livesLbl">Lives</div>
        <div class="hud-val" id="livesVal">❤️❤️❤️</div>
      </div>
      <div class="hud-box">
        <div class="hud-lbl" data-i18n="levelLbl">Level</div>
        <div class="hud-val" id="levelVal">1</div>
      </div>
      <div class="hud-box">
        <div class="hud-lbl" data-i18n="bestLbl">High Score</div>
        <div class="hud-val" id="bestVal">0</div>
      </div>
    </div>

    <canvas id="gameCanvas" width="720" height="460"></canvas>

    <div class="btn-row">
      <button class="btn" id="launchBtn" data-i18n="launchBtn">🚀 Launch Ball / New Game</button>
      <button class="btn btn-secondary" id="wideBtn" data-i18n="wideBtn">⚡ Activate Wide Paddle</button>
    </div>
  </main>

  <script>
    const I18N = {
      en: {
        title: "Neon Brick Breaker (Arkanoid Arcade)",
        scoreLbl: "Score",
        livesLbl: "Lives",
        levelLbl: "Level",
        bestLbl: "High Score",
        launchBtn: "🚀 Launch Ball / New Game",
        wideBtn: "⚡ Activate Wide Paddle"
      },
      fr: {
        title: "Casse-Briques Néon (Arcade Arkanoid)",
        scoreLbl: "Score",
        livesLbl: "Vies",
        levelLbl: "Niveau",
        bestLbl: "Record",
        launchBtn: "🚀 Lancer la Balle / Rejouer",
        wideBtn: "⚡ Raquette Élargie"
      }
    };

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const ROW_COLORS = ["#ef4444", "#f97316", "#eab308", "#10b981", "#06b6d4", "#a855f7"];
    let currentLang = "en";
    let score = 0;
    let bestScore = 0;
    try {
      bestScore = Number(localStorage.getItem("ulp_arkanoid_best") || "0");
    } catch (e) {
      bestScore = 0;
    }
    let lives = 3;
    let level = 1;

    const paddle = { x: 302, y: 428, w: 115, h: 14 };
    const ball = { x: 360, y: 410, vx: 4.2, vy: -4.2, r: 8, active: true };
    let bricks = [];
    let particles = [];

    function beep(freq, dur = 0.06) {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ac = new Ctx();
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.06, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start();
        osc.stop(ac.currentTime + dur + 0.01);
      } catch (e) {}
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 3.5;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color
        });
      }
    }

    function buildBricks() {
      bricks = [];
      const rows = 6, cols = 9;
      const padX = 32, padY = 42, gap = 8;
      const bW = (canvas.width - padX * 2 - gap * (cols - 1)) / cols;
      const bH = 22;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({
            x: padX + c * (bW + gap),
            y: padY + r * (bH + gap),
            w: bW,
            h: bH,
            color: ROW_COLORS[r],
            hp: r === 0 ? 2 : 1
          });
        }
      }
    }

    function updateHUD() {
      if (score > bestScore) {
        bestScore = score;
        try {
          localStorage.setItem("ulp_arkanoid_best", String(bestScore));
        } catch (e) {}
      }
      document.getElementById("scoreVal").textContent = score;
      document.getElementById("livesVal").textContent = "❤️".repeat(Math.max(0, lives)) || "0";
      document.getElementById("levelVal").textContent = level;
      document.getElementById("bestVal").textContent = bestScore;
    }

    function stepGame() {
      ctx.fillStyle = "#040610";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle background grid
      ctx.strokeStyle = "rgba(34, 211, 238, 0.06)";
      ctx.lineWidth = 1;
      for (let gx = 0; gx < canvas.width; gx += 40) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, canvas.height);
        ctx.stroke();
      }
      for (let gy = 0; gy < canvas.height; gy += 40) {
        ctx.beginPath();
        ctx.moveTo(0, gy);
        ctx.lineTo(canvas.width, gy);
        ctx.stroke();
      }

      // Draw bricks
      bricks.forEach(b => {
        if (b.hp <= 0) return;
        ctx.save();
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.restore();
        if (b.hp > 1) {
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 2;
          ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
        }
      });

      // Draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        ctx.globalAlpha = 1;
      }

      // Draw paddle
      ctx.save();
      ctx.shadowColor = "#22d3ee";
      ctx.shadowBlur = 14;
      ctx.fillStyle = "#22d3ee";
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.restore();

      // Ball physics
      if (ball.active) {
        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) {
          ball.vx *= -1;
          beep(320);
        }
        if (ball.y - ball.r < 0) {
          ball.vy *= -1;
          beep(360);
        }

        // Paddle collision
        if (
          ball.vy > 0 &&
          ball.y + ball.r >= paddle.y &&
          ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x >= paddle.x &&
          ball.x <= paddle.x + paddle.w
        ) {
          const hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          ball.vx = hitPos * 5.2;
          ball.vy = -Math.abs(ball.vy);
          beep(480);
        }

        // Brick collision
        for (let i = 0; i < bricks.length; i++) {
          const b = bricks[i];
          if (b.hp > 0 && ball.x > b.x && ball.x < b.x + b.w && ball.y - ball.r < b.y + b.h && ball.y + ball.r > b.y) {
            b.hp--;
            ball.vy *= -1;
            score += 20;
            spawnParticles(ball.x, ball.y, b.color);
            beep(640);
            updateHUD();
            break;
          }
        }

        if (bricks.every(b => b.hp <= 0)) {
          level++;
          buildBricks();
          ball.x = canvas.width / 2;
          ball.y = 380;
          updateHUD();
        }

        if (ball.y > canvas.height + 15) {
          lives--;
          if (lives <= 0) {
            lives = 3;
            score = 0;
            buildBricks();
          }
          ball.x = paddle.x + paddle.w / 2;
          ball.y = 400;
          ball.vy = -4.2;
          updateHUD();
        }
      }

      // Draw ball
      ctx.save();
      ctx.shadowColor = "#ffffff";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      requestAnimationFrame(stepGame);
    }

    canvas.addEventListener("pointermove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, mx - paddle.w / 2));
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") paddle.x = Math.max(0, paddle.x - 28);
      if (e.key === "ArrowRight") paddle.x = Math.min(canvas.width - paddle.w, paddle.x + 28);
    });

    document.getElementById("launchBtn").addEventListener("click", () => {
      score = 0;
      lives = 3;
      buildBricks();
      ball.x = canvas.width / 2;
      ball.y = 400;
      ball.vx = 4.2;
      ball.vy = -4.2;
      ball.active = true;
      updateHUD();
    });

    document.getElementById("wideBtn").addEventListener("click", () => {
      paddle.w = paddle.w === 115 ? 175 : 115;
    });

    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const k = el.getAttribute("data-i18n");
        if (I18N[lang][k]) el.textContent = I18N[lang][k];
      });
    }

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => setLang(btn.dataset.lang));
    });

    buildBricks();
    updateHUD();
    setLang("en");
    requestAnimationFrame(stepGame);
  </script>
</body>
</html>
