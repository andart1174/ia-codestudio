<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown GFM to HTML Pro — Live Sanitized Compiler</title>
  <meta name="description" content="Compilez en direct votre Markdown GFM (tableaux, checklists, blocs de code protégés, H1-H6) en HTML5 sémantique sécurisé avec thèmes Dark Cyber, GitHub Light ou Notion.">
  <link rel="canonical" href="https://ia-codestudio.com/free-tools/converters/markdown-to-html/index.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../converters-style.css">
  <link rel="stylesheet" href="markdown-to-html.css">
</head>
<body class="cyber-bg converter-body">
  <header class="cyber-header">
    <div class="header-logo">
      <span class="logo-icon">📝</span>
      <h1 class="logo-text">MARKDOWN <span class="accent-text">GFM PRO</span></h1>
    </div>
    <div class="header-controls">
      <div class="lang-switcher">
        <button id="btn-lang-fr" class="lang-btn">FR</button>
        <button id="btn-lang-en" class="lang-btn">EN</button>
      </div>
      <a href="../../index.html" class="back-link">
        <span class="back-icon">←</span> <span data-i18n="back_dashboard">Free Tools Hub</span>
      </a>
    </div>
  </header>

  <div class="converter-layout">
    <div class="input-panel">
      <h2 data-i18n="md2h_title" class="panel-title">Compilateur Markdown GFM vers HTML Pro</h2>

      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div class="stats-pill-row">
          <span class="stat-pill" id="md-word-count">0 words</span>
          <span class="stat-pill good" id="md-read-time">1 min read</span>
        </div>
        <select id="md-export-theme" class="form-input" style="width:auto;padding:6px 12px;font-size:0.82rem;">
          <option value="cyber">🌙 Dark Cyber</option>
          <option value="github">☀️ GitHub Light</option>
          <option value="notion">📄 Notion Clean</option>
        </select>
      </div>

      <div class="form-group" style="flex: 1; display: flex; flex-direction: column;">
        <label for="inp-markdown" data-i18n="md_title">Markdown GFM to HTML Pro</label>
        <textarea id="inp-markdown" class="form-input form-textarea" style="flex: 1; min-height: 350px;" data-i18n-placeholder="md2h_input_placeholder"></textarea>
      </div>

      <button type="button" id="btn-compile" class="btn-primary" data-i18n="md2h_convert">Compiler le HTML</button>
    </div>

    <div class="output-panel">
      <h2 data-i18n="preview_panel" class="panel-title">Prévisualisation en direct</h2>

      <div class="visual-preview-box markdown-preview-container">
        <div id="preview-container-box"></div>
      </div>

      <div class="watermark-container">
        <label class="watermark-toggle-label">
          <input type="checkbox" id="chk-watermark" checked>
          <span data-i18n="badge_label">Inclure le badge "Powered by IA Code Studio"</span>
        </label>
      </div>

      <h2 data-i18n="export_title" class="panel-title">Code à intégrer</h2>
      <div class="code-output-area" style="flex: 1; min-height: 220px;">
        <textarea id="output-code" readonly></textarea>
        <div class="code-actions-row">
          <button type="button" id="btn-copy-code" class="action-btn cyan-btn">
            <span>📋</span> <span data-i18n="copy_code">Copier le code</span>
          </button>
          <button type="button" id="btn-download-html" class="action-btn">
            <span>📥</span> <span data-i18n="download_html">Télécharger HTML</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/hub-utils.js"></script>
  <script src="../../js/i18n.js"></script>
  <script src="../../js/main.js"></script>
  <script src="markdown-to-html.js"></script>
</body>
</html>
