<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA CODEPLAY — Markdown to HTML Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../converters-style.css">
  <link rel="stylesheet" href="markdown-to-html.css">
</head>
<body class="cyber-bg converter-body">
  <header class="cyber-header">
    <div class="header-logo">
      <span class="logo-icon">📝</span>
      <h1 class="logo-text">MARKDOWN <span class="accent-text">TO HTML</span></h1>
    </div>
    <div class="header-controls">
      <div class="lang-switcher">
        <button id="btn-lang-fr" class="lang-btn">FR</button>
        <button id="btn-lang-en" class="lang-btn">EN</button>
      </div>
      <a href="../../index.html" class="back-link">
        <span class="back-icon">←</span> <span data-i18n="back_dashboard">Tableau de bord</span>
      </a>
    </div>
  </header>

  <div class="converter-layout">
    <!-- Left: Inputs -->
    <div class="input-panel">
      <h2 data-i18n="md2h_title" class="panel-title">Convertisseur Markdown vers HTML Pro</h2>
      
      <div class="form-group" style="flex: 1; display: flex; flex-direction: column;">
        <label for="inp-markdown" data-i18n="md_title">Code Markdown</label>
        <textarea id="inp-markdown" class="form-input form-textarea" style="flex: 1; min-height: 350px;" data-i18n="md2h_input_placeholder"></textarea>
      </div>

      <button id="btn-compile" class="btn-primary" data-i18n="md2h_convert">Compiler le HTML</button>
    </div>

    <!-- Right: Outputs -->
    <div class="output-panel">
      <h2 data-i18n="preview_panel" class="panel-title">Prévisualisation en direct</h2>
      
      <div class="visual-preview-box markdown-preview-container">
        <div id="preview-container-box">
          <!-- Rendered HTML will load here -->
        </div>
      </div>

      <div class="watermark-container">
        <label class="watermark-toggle-label">
          <input type="checkbox" id="chk-watermark" checked>
          <span data-i18n="badge_label">Inclure le badge "Powered by IA Code Studio"</span>
        </label>
      </div>

      <h2 data-i18n="export_title" class="panel-title">Code à intégrer</h2>
      <div class="code-output-area" style="flex: 1; min-height: 220px;">
        <textarea id="output-code" readonly></textarea>
        <div class="code-actions-row">
          <button id="btn-copy-code" class="action-btn cyan-btn">
            <span>📋</span> <span data-i18n="copy_code">Copier le code</span>
          </button>
          <button id="btn-download-html" class="action-btn">
            <span>📥</span> <span data-i18n="download_html">Télécharger HTML</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/i18n.js"></script>
  <script src="../../js/main.js"></script>
  <script src="markdown-to-html.js"></script>
</body>
</html>
