<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA CODEPLAY — Text to Glassmorphic Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../converters-style.css">
  <link rel="stylesheet" href="text-to-html.css">
</head>
<body class="cyber-bg converter-body">
  <header class="cyber-header">
    <div class="header-logo">
      <span class="logo-icon">🔮</span>
      <h1 class="logo-text">TEXT TO <span class="accent-text">GLASS</span></h1>
    </div>
    <div class="header-controls">
      <div class="lang-switcher">
        <button id="btn-lang-fr" class="lang-btn">FR</button>
        <button id="btn-lang-en" class="lang-btn">EN</button>
      </div>
      <a href="../../index.html" class="back-link">
        <span class="back-icon">←</span> <span data-i18n="back_dashboard">Tableau de bord</span>
      </a>
    </div>
  </header>

  <div class="converter-layout">
    <!-- Left: Inputs -->
    <div class="input-panel">
      <h2 data-i18n="t2g_title" class="panel-title">Convertisseur Text vers Card Glassmorphism</h2>
      
      <div class="form-group">
        <label for="inp-title" data-i18n="t2g_label_title">Titre de la carte</label>
        <input type="text" id="inp-title" class="form-input" data-i18n="t2g_preview_card_title" value="Mon Beau Projet 3D">
      </div>

      <div class="form-group">
        <label for="inp-desc" data-i18n="t2g_label_desc">Description</label>
        <textarea id="inp-desc" class="form-input form-textarea" data-i18n="t2g_preview_card_desc">Créez de superbes interfaces en verre dépoli avec des reflets lumineux colorés.</textarea>
      </div>

      <div class="form-group">
        <label for="inp-btn" data-i18n="t2g_label_btn">Texte du bouton</label>
        <input type="text" id="inp-btn" class="form-input" data-i18n="t2g_preview_card_btn" value="Découvrir →">
      </div>

      <div class="form-row">
        <div class="form-group half-width">
          <label for="inp-color" data-i18n="t2g_label_color">Couleur dominante (Glow)</label>
          <input type="color" id="inp-color" class="form-input color-picker" value="#00f0ff">
        </div>
        <div class="form-group half-width">
          <label for="inp-blur" data-i18n="t2g_label_blur">Niveau de flou (Blur)</label>
          <div class="slider-container">
            <input type="range" id="inp-blur" min="4" max="30" value="12">
            <span id="blur-val">12px</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Outputs -->
    <div class="output-panel">
      <h2 data-i18n="preview_panel" class="panel-title">Prévisualisation en direct</h2>
      
      <div class="visual-preview-box text-to-html-box">
        <div id="preview-container-box">
          <!-- Glassmorphic card rendered here dynamically -->
        </div>
      </div>

      <div class="watermark-container">
        <label class="watermark-toggle-label">
          <input type="checkbox" id="chk-watermark" checked>
          <span data-i18n="badge_label">Inclure le badge "Powered by IA Code Studio"</span>
        </label>
      </div>

      <h2 data-i18n="export_title" class="panel-title">Code à intégrer</h2>
      <div class="code-output-area">
        <textarea id="output-code" readonly></textarea>
        <div class="code-actions-row">
          <button id="btn-copy-code" class="action-btn cyan-btn">
            <span>📋</span> <span data-i18n="copy_code">Copier le code</span>
          </button>
          <button id="btn-download-html" class="action-btn">
            <span>📥</span> <span data-i18n="download_html">Télécharger HTML</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/i18n.js"></script>
  <script src="../../js/main.js"></script>
  <script src="text-to-html.js"></script>
</body>
</html>
