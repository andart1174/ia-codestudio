<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Particle Explosion · Three.js WebGL</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #030712;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      color: #ffffff;
    }

    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
      z-index: 1;
      cursor: crosshair;
    }

    .hint-label {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: rgba(139, 92, 246, 0.55);
      z-index: 10;
      text-transform: uppercase;
      white-space: nowrap;
      animation: pulse-hint 2.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse-hint {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.9; }
    }

    .ia-badge {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 20px;
      border-radius: 16px;
      z-index: 10;
      max-width: 300px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(139,92,246,0.1);
      transition: all 0.3s ease;
    }

    .ia-badge:hover {
      border-color: rgba(139, 92, 246, 0.6);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 25px rgba(139,92,246,0.25);
      transform: translateY(-2px);
    }

    .badge-tag {
      background: rgba(139, 92, 246, 0.2);
      color: #c084fc;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: 30px;
      display: inline-block;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .ia-badge h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #fff 40%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ia-badge p {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .badge-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      padding: 10px 16px;
      border-radius: 20px;
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.1);
      width: 100%;
    }

    .badge-link:hover {
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <div id="webgl-container"></div>

  <div class="hint-label">HOVER OVER THE TEXT</div>

  <div class="ia-badge">
    <span class="badge-tag">WebGL 3D Particles</span>
    <h3>Text Particle Explosion</h3>
    <p>Hover over the text to explode it into thousands of particles. Move away to watch it reassemble.</p>
    <a href="https://ia-codestudio.com" target="_blank" class="badge-link">
      Create More 3D Widgets on IA Code Studio 🚀
    </a>
  </div>

  <script>
    document.fonts.ready.then(() => {
      initTextParticles();
    });

    function initTextParticles() {
      const container = document.getElementById('webgl-container');
      const W = window.innerWidth;
      const H = window.innerHeight;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, W / H, 0.1, 2000);
      camera.position.z = 500;

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x030712, 1);
      container.appendChild(renderer.domElement);

      // Draw text on offscreen canvas to sample pixel positions
      const scale = 3;
      const offscreen = document.createElement('canvas');
      offscreen.width = W / scale;
      offscreen.height = H / scale;
      const ctx = offscreen.getContext('2d');

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, offscreen.width, offscreen.height);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const fSize = Math.min(offscreen.width / 5, 90);
      ctx.font = '900 ' + fSize + 'px Outfit, Arial Black, sans-serif';
      ctx.fillText('IA CODE', offscreen.width / 2, offscreen.height / 2 - fSize * 0.65);
      ctx.fillText('STUDIO', offscreen.width / 2, offscreen.height / 2 + fSize * 0.65);

      const imageData = ctx.getImageData(0, 0, offscreen.width, offscreen.height);
      const pixels = imageData.data;

      const sampledPositions = [];
      const gap = 3;
      for (let y = 0; y < offscreen.height; y += gap) {
        for (let x = 0; x < offscreen.width; x += gap) {
          const idx = (y * offscreen.width + x) * 4;
          if (pixels[idx] > 120) {
            sampledPositions.push({
              x: (x - offscreen.width / 2) * scale,
              y: -(y - offscreen.height / 2) * scale
            });
          }
        }
      }

      const count = sampledPositions.length;
      if (count === 0) return;

      const positions = new Float32Array(count * 3);
      const originalPos = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const velocities = new Float32Array(count * 3);

      const palette = [
        [0.545, 0.361, 0.965],
        [0.024, 0.714, 0.831],
        [0.851, 0.275, 0.937],
        [0.655, 0.545, 0.988],
        [0.404, 0.910, 0.945]
      ];

      for (let i = 0; i < count; i++) {
        const sp = sampledPositions[i];
        originalPos[i * 3] = sp.x;
        originalPos[i * 3 + 1] = sp.y;
        originalPos[i * 3 + 2] = 0;
        positions[i * 3] = sp.x;
        positions[i * 3 + 1] = sp.y;
        positions[i * 3 + 2] = 0;
        const c = palette[i % palette.length];
        colors[i * 3] = c[0];
        colors[i * 3 + 1] = c[1];
        colors[i * 3 + 2] = c[2];
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: 3.5, vertexColors: true, transparent: true, opacity: 0.92, sizeAttenuation: true
      });

      const points = new THREE.Points(geom, mat);
      scene.add(points);

      let isExploded = false;
      let mouseX = 0, mouseY = 0;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX - W / 2;
        mouseY = -(e.clientY - H / 2);
      });

      renderer.domElement.addEventListener('mousemove', (e) => {
        const x = e.clientX - W / 2;
        const y = e.clientY - H / 2;
        const inZone = Math.abs(x) < W * 0.4 && Math.abs(y) < H * 0.25;
        if (inZone && !isExploded) {
          isExploded = true;
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 4 + Math.random() * 14;
            velocities[i * 3] = Math.cos(angle) * speed;
            velocities[i * 3 + 1] = Math.sin(angle) * speed;
            velocities[i * 3 + 2] = (Math.random() - 0.5) * 6;
          }
        } else if (!inZone && isExploded) {
          isExploded = false;
        }
      });

      renderer.domElement.addEventListener('mouseleave', () => { isExploded = false; });

      const posAttr = geom.attributes.position;
      const colAttr = geom.attributes.color;
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        for (let i = 0; i < count; i++) {
          let cx = posAttr.getX(i), cy = posAttr.getY(i), cz = posAttr.getZ(i);
          const ox = originalPos[i * 3], oy = originalPos[i * 3 + 1];

          if (isExploded) {
            cx += velocities[i * 3];
            cy += velocities[i * 3 + 1];
            cz += velocities[i * 3 + 2];
            velocities[i * 3] *= 0.95;
            velocities[i * 3 + 1] *= 0.95;
            velocities[i * 3 + 2] *= 0.95;
            const dx = mouseX - cx, dy = mouseY - cy;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 1) { const force = Math.min(60/dist, 2.5); cx += dx*force*0.02; cy += dy*force*0.02; }
            const pulse = (Math.sin(t * 8 + i * 0.15) + 1) * 0.5;
            colAttr.setXYZ(i, 0.5 + pulse * 0.5, 0.1 + pulse * 0.3, 0.9 + pulse * 0.1);
          } else {
            cx += (ox - cx) * 0.09; cy += (oy - cy) * 0.09; cz += (0 - cz) * 0.09;
            const breathe = Math.sin(t * 1.8 + i * 0.06) * 1.2;
            const sway = Math.cos(t * 1.4 + i * 0.04) * 1.2;
            cx += sway * 0.25; cy += breathe * 0.25;
            const shimmer = (Math.sin(t * 2.5 + i * 0.25) + 1) * 0.5;
            const c = palette[i % palette.length];
            colAttr.setXYZ(i, c[0] + shimmer * 0.15, c[1] + shimmer * 0.1, c[2]);
          }
          posAttr.setXYZ(i, cx, cy, cz);
        }

        posAttr.needsUpdate = true;
        colAttr.needsUpdate = true;
        camera.position.x = Math.sin(t * 0.25) * 20;
        camera.position.y = Math.cos(t * 0.18) * 10;
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        const nw = window.innerWidth, nh = window.innerHeight;
        camera.aspect = nw / nh;
        camera.updateProjectionMatrix();
        renderer.setSize(nw, nh);
      });
    }
  </script>
</body>
</html>
