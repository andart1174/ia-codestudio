<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IA Code Studio — WebAR Instant Preview</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #fff; }
        
        #app-wrapper { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; }
        
        /* Top Bar */
        .top-bar { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 50; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .brand-pill { display: flex; align-items: center; gap: 8px; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(139, 92, 246, 0.4); padding: 8px 14px; border-radius: 30px; backdrop-filter: blur(12px); pointer-events: auto; }
        .brand-pill img { width: 22px; height: 22px; border-radius: 50%; }
        .brand-pill span { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #f8fafc; }
        
        /* Center Model Viewers */
        #model-viewer-container { width: 100%; height: 100%; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }
        model-viewer { width: 100%; height: 100%; background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%); display: none; }

        /* Bottom Controls */
        .bottom-controls { position: absolute; bottom: 24px; left: 0; right: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 20px; pointer-events: auto; }
        
        .ar-trigger-btn {
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.5);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.25s ease;
            animation: pulseGlow 2s infinite;
        }
        .ar-trigger-btn:active { transform: scale(0.95); }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(139, 92, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }

        .footer-pill { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 6px 14px; border-radius: 20px; font-size: 11px; color: #94a3b8; }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div class="top-bar">
            <div class="brand-pill">
                <img src="../logo-ia-codestudio.webp" alt="Logo">
                <span id="ar-title-label">IA CODE STUDIO — 3D SCENE PREVIEW</span>
            </div>
        </div>

        <div id="model-viewer-container">
            <canvas id="three-canvas"></canvas>
            <model-viewer id="mv" 
                src=""
                alt="Custom 3D Model AR"
                ar 
                ar-modes="webxr scene-viewer quick-look" 
                camera-controls 
                auto-rotate 
                shadow-intensity="1.5"
                exposure="1.2">
            </model-viewer>
        </div>

        <div class="bottom-controls">
            <button class="ar-trigger-btn" onclick="triggerAR()">
                📷 Activer Caméra AR (Placer dans votre pièce)
            </button>
            <div class="footer-pill">✨ Propulsé par IA Code Studio 3D Engine</div>
        </div>
    </div>

    <script>
        function triggerAR() {
            const mv = document.getElementById('mv');
            if (mv && mv.style.display !== 'none' && typeof mv.activateAR === 'function') {
                mv.activateAR();
            } else {
                alert("📱 Mode Caméra AR : Pour activer la caméra en temps réel dans votre pièce, ouvrez ce lien dans Safari (iPhone) ou Chrome (Android) et autorisez l'accès caméra.");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initRobustThreeScene();
        });

        function initRobustThreeScene() {
            const canvas = document.getElementById('three-canvas');
            if (!canvas) return;

            const urlParams = new URLSearchParams(window.location.search);
            const hexColorParam = urlParams.get('c') || localStorage.getItem('ia_ar_color') || '#00ffcc';
            const depthParam = parseFloat(urlParams.get('d')) || parseFloat(localStorage.getItem('ia_ar_depth')) || 30;
            const pointsParam = urlParams.get('p') || localStorage.getItem('ia_ar_pts');
            const modParam = urlParams.get('mod') || localStorage.getItem('ia_ar_mod') || 'custom';
            const objDataStored = localStorage.getItem('ia_ar_obj_data');

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090d16);
            
            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);

            const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Bright Multi-Light Setup
            scene.add(new THREE.AmbientLight(0xffffff, 1.4));

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.6);
            dirLight1.position.set(100, 200, 150);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x8b5cf6, 1.2);
            dirLight2.position.set(-100, -100, -100);
            scene.add(dirLight2);

            let mainMesh = null;
            const parsedColor = new THREE.Color(hexColorParam);
            const material = new THREE.MeshStandardMaterial({
                color: parsedColor,
                roughness: 0.25,
                metalness: 0.4,
                side: THREE.DoubleSide
            });

            // 1. Check Stored OBJ Data
            if (objDataStored && typeof THREE.OBJLoader !== 'undefined') {
                try {
                    const loader = new THREE.OBJLoader();
                    const loadedGroup = loader.parse(objDataStored);
                    loadedGroup.traverse(child => {
                        if (child.isMesh && (!child.material || child.material.type === 'MeshBasicMaterial')) {
                            child.material = material;
                        }
                    });
                    mainMesh = loadedGroup;
                    scene.add(mainMesh);
                } catch(e) {}
            }

            // 2. Check Extruded 2D Contour Points
            if (!mainMesh && pointsParam) {
                try {
                    const ptsArray = pointsParam.split('|').map(str => {
                        const parts = str.split(',');
                        return new THREE.Vector2(parseFloat(parts[0]), parseFloat(parts[1]));
                    });

                    if (ptsArray.length > 2) {
                        const shape = new THREE.Shape(ptsArray);
                        const extrudeSettings = {
                            depth: depthParam,
                            bevelEnabled: true,
                            bevelSegments: 4,
                            steps: 2,
                            bevelSize: 3,
                            bevelThickness: 3
                        };
                        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                        mainMesh = new THREE.Mesh(geometry, material);
                        scene.add(mainMesh);
                    }
                } catch(e){}
            }

            // 3. Fallback High-Quality 3D Shape if no custom data
            if (!mainMesh) {
                const group = new THREE.Group();
                const torsoGeo = new THREE.CylinderGeometry(15, 12, 40, 16);
                const torsoMat = new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 0.3 });
                const torso = new THREE.Mesh(torsoGeo, torsoMat);
                group.add(torso);

                const headGeo = new THREE.SphereGeometry(10, 32, 32);
                const headMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, metalness: 0.5 });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 30;
                group.add(head);

                mainMesh = group;
                scene.add(mainMesh);
            }

            // 🚀 AUTOMATIC 3D AUTO-FIT & AUTO-CENTERING
            if (mainMesh) {
                const box = new THREE.Box3().setFromObject(mainMesh);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                mainMesh.position.x -= center.x;
                mainMesh.position.y -= center.y;
                mainMesh.position.z -= center.z;

                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2.0;

                if (camera.aspect < 1) {
                    cameraZ /= camera.aspect;
                }

                camera.position.set(0, 0, cameraZ);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                
                if (mainMesh) {
                    const box = new THREE.Box3().setFromObject(mainMesh);
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2.0;
                    if (camera.aspect < 1) cameraZ /= camera.aspect;
                    camera.position.z = cameraZ;
                    controls.update();
                }
            });

            function animate() {
                requestAnimationFrame(animate);
                if (mainMesh) {
                    mainMesh.rotation.y += 0.006;
                }
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
