<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IA Code Studio — WebAR Instant Preview</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #fff; }
        #ar-container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        model-viewer { width: 100%; height: 100%; background-color: #090d16; --poster-color: transparent; }
        .ar-overlay { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 90%; max-width: 400px; text-align: center; }
        .ar-btn { background: linear-gradient(135deg, #8b5cf6, #06b6d4); color: #fff; border: none; border-radius: 50px; padding: 16px 32px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4); display: inline-flex; align-items: center; gap: 10px; text-decoration: none; transition: transform 0.2s; }
        .ar-btn:active { transform: translateX(-50%) scale(0.96); }
        .ar-badge { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); padding: 8px 16px; border-radius: 20px; font-size: 12px; color: #94a3b8; }
        .header-brand { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; align-items: center; gap: 10px; background: rgba(15, 23, 42, 0.7); padding: 8px 16px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .header-brand img { width: 24px; height: 24px; border-radius: 50%; }
        .header-brand span { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; color: #f8fafc; }
    </style>
</head>
<body>
    <div id="ar-container">
        <div class="header-brand">
            <img src="../logo-ia-codestudio.webp" alt="Logo">
            <span>IA CODE STUDIO — AR</span>
        </div>

        <model-viewer id="viewer" 
            src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Astronaut/glTF-Binary/Astronaut.glb"
            alt="Modèle 3D AR"
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            auto-rotate 
            shadow-intensity="1.5"
            shadow-softness="1"
            exposure="1.2">
            
            <button slot="ar-button" class="ar-btn">
                📱 Placer dans votre pièce (AR)
            </button>
        </model-viewer>

        <div class="ar-overlay">
            <div class="ar-badge">✨ Propulsé par IA Code Studio WebAR Engine</div>
        </div>
    </div>

    <script>
        // Check for custom model passed via URL hash or search parameter
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const customSrc = params.get('model');
            const viewer = document.getElementById('viewer');
            if (customSrc && viewer) {
                viewer.src = customSrc;
            }
        });
    </script>
</body>
</html>
