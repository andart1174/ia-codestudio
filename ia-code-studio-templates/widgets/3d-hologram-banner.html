<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  const container = document.getElementById('hologram-banner-abc1234');
  const viewport = document.getElementById('viewport-hologram-abc1234');
  if (!viewport || !container) return;

  function initWhenReady() {
    if (typeof THREE !== 'undefined') {
      startWidget();
    } else {
      setTimeout(initWhenReady, 50);
    }
  }
  initWhenReady();

  function startWidget() {
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 100);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    viewport.appendChild(renderer.domElement);

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambient);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0x06b6d4, 1, 10);
    pointLight.position.set(-2, 2, 3);
    scene.add(pointLight);

    // ---- Star field ----
    var starPos = new Float32Array(300 * 3);
    for (var si = 0; si < 300; si++) {
      starPos[si*3]   = (Math.random()-0.5)*20;
      starPos[si*3+1] = (Math.random()-0.5)*20;
      starPos[si*3+2] = (Math.random()-0.5)*10 - 5;
    }
    var starGeom = new THREE.BufferGeometry();
    starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    var starField = new THREE.Points(starGeom, new THREE.PointsMaterial({color:0xffffff,size:0.025,transparent:true,opacity:0.5}));
    scene.add(starField);

    // ---- Build geometry & mesh for all 13 shapes ----
    var shape = "can";
    var colorHex = "#06b6d4";
    var stdMat = new THREE.MeshStandardMaterial({color:colorHex,roughness:0.1,metalness:0.9,emissive:colorHex,emissiveIntensity:0.2,wireframe:(shape==='globe')});
    var currentMesh = null;

    if (shape === 'galaxy') {
      var gCount = 2000, gPos = new Float32Array(gCount*3);
      for (var i=0;i<gCount;i++) {
        var angle=Math.random()*Math.PI*2, radius=Math.pow(Math.random(),0.5)*1.8;
        var arm=Math.floor(Math.random()*3)*(Math.PI*2/3), twist=radius*2.5;
        gPos[i*3]=Math.cos(angle+arm+twist)*radius;
        gPos[i*3+1]=(Math.random()-0.5)*0.15;
        gPos[i*3+2]=Math.sin(angle+arm+twist)*radius;
      }
      var gG=new THREE.BufferGeometry();
      gG.setAttribute('position',new THREE.BufferAttribute(gPos,3));
      currentMesh=new THREE.Points(gG,new THREE.PointsMaterial({color:colorHex,size:0.02,transparent:true,opacity:0.9}));

    } else if (shape === 'target') {
      currentMesh = new THREE.Group();
      for (var ti=1;ti<=5;ti++) {
        var rm=new THREE.MeshStandardMaterial({color:colorHex,emissive:colorHex,emissiveIntensity:1.5-ti*0.2,transparent:true,opacity:1.2-ti*0.15});
        currentMesh.add(new THREE.Mesh(new THREE.TorusGeometry(ti*0.2,0.02,8,80),rm));
      }
      currentMesh.add(new THREE.Mesh(new THREE.SphereGeometry(0.06,16,16),new THREE.MeshStandardMaterial({color:colorHex,emissive:colorHex,emissiveIntensity:3})));

    } else if (shape === 'saturn') {
      currentMesh = new THREE.Group();
      currentMesh.add(new THREE.Mesh(new THREE.SphereGeometry(0.55,32,32),stdMat.clone()));
      var rr=new THREE.Mesh(new THREE.TorusGeometry(0.9,0.18,4,120),new THREE.MeshStandardMaterial({color:colorHex,emissive:colorHex,emissiveIntensity:0.3,transparent:true,opacity:0.65,side:THREE.DoubleSide}));
      rr.rotation.x=Math.PI/2.5; currentMesh.add(rr);

    } else if (shape === 'dna') {
      currentMesh = new THREE.Group();
      function addStrand(off) {
        var pts=[];
        for(var i=0;i<=80;i++){var t=(i/80)*Math.PI*6,y=(i/80)*2.4-1.2;pts.push(new THREE.Vector3(Math.cos(t+off)*0.5,y,Math.sin(t+off)*0.5));}
        currentMesh.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),80,0.055,8,false),stdMat.clone()));
      }
      addStrand(0); addStrand(Math.PI);
      for(var di=0;di<=24;di++){
        var dt=(di/24)*Math.PI*6,dy=(di/24)*2.4-1.2;
        var rung=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,1.0,6),new THREE.MeshStandardMaterial({color:colorHex,emissive:colorHex,emissiveIntensity:0.5}));
        rung.position.set(0,dy,0); rung.rotation.y=dt; rung.rotation.z=Math.PI/2;
        currentMesh.add(rung);
      }

    } else if (shape === 'mobius') {
      var mb=new THREE.BufferGeometry(), mv=[], muv=[], uS=100, vS=20;
      for(var i=0;i<=uS;i++){for(var j=0;j<=vS;j++){
        var u=(i/uS)*Math.PI*2, v=(j/vS)-0.5;
        mv.push((1+v*0.5*Math.cos(u/2))*Math.cos(u)*0.8,(1+v*0.5*Math.cos(u/2))*Math.sin(u)*0.8,v*0.5*Math.sin(u/2)*0.8);
        muv.push(i/uS,j/vS);
      }}
      var mi=[];
      for(var i=0;i<uS;i++){for(var j=0;j<vS;j++){var a=i*(vS+1)+j,b=a+vS+1;mi.push(a,b,a+1,b,b+1,a+1);}}
      mb.setAttribute('position',new THREE.Float32BufferAttribute(mv,3));
      mb.setAttribute('uv',new THREE.Float32BufferAttribute(muv,2));
      mb.setIndex(mi); mb.computeVertexNormals();
      currentMesh=new THREE.Mesh(mb,stdMat);

    } else {
      var geom;
      if(shape==='knot')    geom=new THREE.TorusKnotGeometry(0.7,0.22,120,16);
      else if(shape==='torus')   geom=new THREE.TorusGeometry(0.8,0.25,20,100);
      else if(shape==='sphere')  geom=new THREE.IcosahedronGeometry(0.9,2);
      else if(shape==='diamond') geom=new THREE.OctahedronGeometry(1.0,0);
      else if(shape==='dodeca')  geom=new THREE.DodecahedronGeometry(0.9,0);
      else if(shape==='crystal') geom=new THREE.IcosahedronGeometry(0.9,1);
      else if(shape==='electric') geom=new THREE.OctahedronGeometry(0.9,2);
      else if(shape==='globe')   geom=new THREE.SphereGeometry(0.9,18,12);
      else geom=new THREE.TorusKnotGeometry(0.7,0.22,120,16);
      currentMesh=new THREE.Mesh(geom,stdMat);
    }

    scene.add(currentMesh);

    // Mouse Parallax Calculation
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;
    const sensitivity = ${sens} / 100;

    container.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      targetX = (x - 0.5) * 2 * sensitivity;
      targetY = -(y - 0.5) * 2 * sensitivity;
    });

    container.addEventListener('mouseleave', () => {
      targetX = 0;
      targetY = 0;
    });

    // Mobile Gyroscope tilt
    window.addEventListener('deviceorientation', (e) => {
      if (!e.gamma || !e.beta) return;
      const tiltX = e.gamma / 45;
      const tiltY = (e.beta - 45) / 45;
      targetX = Math.max(-1,Math.min(1,tiltX)) * sensitivity;
      targetY = -Math.max(-1,Math.min(1,tiltY)) * sensitivity;
    });

    var clock = 0;
    function animate() {
      requestAnimationFrame(animate);
      clock += 0.016;

      currentX += (targetX - currentX) * 0.08;
      currentY += (targetY - currentY) * 0.08;
      camera.position.x = currentX * 1.5;
      camera.position.y = currentY * 1.5;
      camera.lookAt(scene.position);

      starField.rotation.y += 0.0003;

      if (currentMesh) {
        if (shape === 'target') {
          currentMesh.children.forEach(function(r,i){ r.rotation.z += 0.012*(i%2===0?1:-1); r.rotation.x=Math.sin(clock*0.5+i)*0.3; });
        } else if (shape === 'galaxy') { currentMesh.rotation.y += 0.003; }
        else if (shape === 'dna') { currentMesh.rotation.y += 0.006; currentMesh.position.y=Math.sin(clock*0.8)*0.05; }
        else if (shape === 'saturn') { currentMesh.rotation.y += 0.007; if(currentMesh.children[1]) currentMesh.children[1].rotation.x=Math.PI/2.5+Math.sin(clock*0.4)*0.1; }
        else if (shape === 'mobius') { currentMesh.rotation.y += 0.01; currentMesh.rotation.z += 0.003; }
        else if (shape === 'electric') { currentMesh.rotation.x += 0.015; currentMesh.rotation.y += 0.008; var p=1+Math.sin(clock*5)*0.06; currentMesh.scale.set(p,p,p); }
        else { currentMesh.rotation.y += 0.005; currentMesh.rotation.x += 0.002; }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = viewport.clientWidth / viewport.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    });
  }
})();
<</script>
<!-- END IA CODE STUDIO 3D HOLOGRAM BANNER WIDGET -->
